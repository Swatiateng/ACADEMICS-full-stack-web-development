<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <label>enter a number:</label>
    <input type="text" id="number">
    <input type="text" id="number2">
    <input type="text" id="number3">
    <button onclick="checkNumber()">find max</button>
    <p id="max"></p>

    <script>
       function checkNumber(){
        let first=parseInt(document.getElementById("number").value);
        let second=parseInt(document.getElementById("number2").value);
        let third=parseInt(document.getElementById("number3").value);
        let max=first;
        if(second>max && second>third){
            max=second;
        }
        else if(third>max ){
            max=third;
        }
        document.getElementById("max").innerHTML="The maximum number is: "+max;
       }
    </script>
</body>
</html>
