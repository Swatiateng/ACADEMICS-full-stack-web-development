<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Handling</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #eaf2cc;
            color: #863073;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            color: white;
            background-color: #007BFF;
        }
        p {
            font-size: 14px;
        }
    </style>
</head>
<body>
    <h1>swati basanagouda bagali 4NI24CS228</h1>
    
    <h2>JavaScript Event Handling</h2>
    <button id="myButton">Click Me</button>
    <p id="successMessage"></p>
    
    <h2>Type Something</h2>
    <input type="text" id="textBox" placeholder="Enter text">
    <p id="outputText">Your text will appear here.</p>
    
    <h2>Password Strength</h2>
    <input type="password" id="password" placeholder="Enter password">
    <p id="strength"></p>

    <script>
        // Global click alert on body
        document.body.addEventListener("click", function () {
            alert("You clicked on the page!");
        });

        // Button click handling with event propagation stopped
        let button = document.getElementById("myButton");
        let successMessage = document.getElementById("successMessage");
        
        button.addEventListener("click", function (event) {
            event.stopPropagation();
            button.textContent = "Clicked!";
            successMessage.textContent = "Success! Button was clicked.";
            successMessage.style.color = "red";
        });

        // Text box live mirror effect
        let textBox = document.getElementById("textBox");
        let outputText = document.getElementById("outputText");
        
        textBox.addEventListener("input", function () {
            outputText.textContent = textBox.value;
            outputText.style.color = "blue";
        });

        // Dynamic password strength check
        let password = document.getElementById("password");
        let strength = document.getElementById("strength");
        
        password.addEventListener("input", function () {
            let length = password.value.length;
            if (length === 0) {
                strength.textContent = "";
            } else if (length < 6) {
                strength.textContent = "Weak";
                strength.style.color = "red";
            } else if (length < 10) {
                strength.textContent = "Medium";
                strength.style.color = "orange";
            } else {
                strength.textContent = "Strong";
                strength.style.color = "green";
            }
        });
    </script>
</body>
</html>
